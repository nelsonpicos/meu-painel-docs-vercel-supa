<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Amazon Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col text-gray-800 bg-[#f3f4f6]">

<div id="root"></div>

<script type="text/babel">
    const { useState } = React;

    const mockDocs = [
        {
            id: 1,
            tags: ['Docs'],
            title: 'Documento de Identificação e Cadastro',
            desc: 'Resumo das informações para viagens e cadastro corporativo.',
            date: '27/07/2026',
            labels: ['#importante', '#urgente'],
            mainCard: { title: 'COMPROVANTE', color: 'bg-blue-50 border border-blue-200 text-blue-800' }
        },
        {
            id: 2,
            tags: ['Notas'],
            title: 'Anotações de Reunião da Unidade',
            desc: 'Instruções para o armazenamento de arquivos no pendrive.',
            date: '27/07/2026',
            labels: ['#nota', '#estudo'],
            mainCard: null
        },
        {
            id: 3,
            tags: ['Financeiro'],
            title: 'Comprovante de Pagamento de Licença',
            desc: 'Fatura e comprovante de renovação de software.',
            date: '25/07/2026',
            labels: ['#receita', '#importante'],
            mainCard: { title: 'PAGO', color: 'bg-green-50 border border-green-200 text-green-800' }
        },
    ];

    const categories = [
        { name: 'Documentos', count: 3, icon: 'fa-file-lines' },
        { name: 'Financeiro', count: 1, icon: 'fa-coins' },
        { name: 'Projetos', count: 0, icon: 'fa-diagram-project' },
    ];

    const App = () => {
        // Estado para controlar o que foi digitado na busca
        const [searchTerm, setSearchTerm] = useState("");

        return (
            <div className="flex flex-col h-screen bg-[#f3f4f6] overflow-hidden">
                
                {/* CABEÇALHO SUPERIOR (Estilo Amazon) */}
                <header className="bg-[#131921] text-white px-6 py-4 flex items-center justify-between shrink-0 shadow-sm">
                    <div className="flex items-center gap-4">
                        <div className="text-[#FF9900] text-2xl"><i className="fas fa-folder-open"></i></div>
                        <div>
                            <h1 className="text-xl font-bold tracking-tight">Painel</h1>
                            <p className="text-[10px] text-gray-400 font-medium">Sua central de arquivos</p>
                        </div>
                    </div>

                    <div className="flex items-center gap-3">
                        <button className="border border-gray-500 hover:border-white px-3 py-1.5 rounded text-xs font-medium transition-colors flex items-center gap-2">
                            <i className="fab fa-google-drive text-blue-400"></i> Conectar
                        </button>
                        <button className="bg-[#FF9900] hover:bg-[#e88d00] text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-2 transition-colors">
                            <i className="fas fa-plus"></i> Novo
                        </button>
                    </div>
                </header>

                {/* CONTEÚDO PRINCIPAL */}
                <div className="flex-1 overflow-y-auto p-6">
                    
                    {/* CAMPO DE BUSCA NO TOPO (Estilo Amazon: Limpo, com borda definida) */}
                    <div className="max-w-3xl mx-auto mb-8 w-full">
                        <div className="relative group">
                            <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i className="fas fa-search text-gray-400 group-focus-within:text-[#FF9900] transition-colors"></i>
                            </div>
                            <input 
                                type="text" 
                                placeholder="Pesquisar por título, categoria ou tag..." 
                                className="w-full bg-white border-2 border-gray-300 text-gray-800 pl-11 pr-4 py-3 rounded-xl outline-none transition-all focus:border-[#FF9900] focus:ring-1 focus:ring-[#FF9900] placeholder-gray-400 shadow-sm"
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                            />
                        </div>
                    </div>

                    {/* BANNER DE CONEXÃO */}
                    <div className="bg-white border border-gray-200 rounded-xl p-4 flex items-center justify-between mb-6 shadow-sm">
                        <div className="flex items-center gap-3">
                            <i className="fas fa-cloud text-gray-400 text-xl"></i>
                            <div>
                                <h3 className="font-bold text-gray-800 text-sm">Armazenamento na Nuvem</h3>
                                <p className="text-xs text-gray-500">Conecte sua conta para sincronizar tudo.</p>
                            </div>
                        </div>
                        <button className="bg-black hover:bg-gray-800 text-white px-4 py-2 rounded-full text-xs font-semibold transition-colors border border-gray-700">
                            <i className="fab fa-google-drive mr-2"></i> Conectar Google Drive
                        </button>
                    </div>

                    {/* GRID PRINCIPAL */}
                    <div className="flex gap-6 h-full">
                        
                        {/* BARRA LATERAL */}
                        <aside className="w-64 shrink-0 bg-white rounded-xl p-4 border border-gray-200 shadow-sm h-fit">
                            <h3 className="text-xs font-bold uppercase tracking-wider text-gray-500 border-b pb-3 mb-3">Filtros</h3>
                            <ul className="space-y-1 mb-4">
                                <li className="bg-gray-100 text-gray-900 px-3 py-2 rounded-md flex items-center justify-between cursor-pointer text-sm font-medium border border-gray-200">
                                    <span className="flex items-center gap-3"><i className="fas fa-folder-open text-[#FF9900]"></i> Todos</span>
                                    <span className="bg-gray-200 text-gray-600 text-[10px] font-bold px-2 py-0.5 rounded-full">3</span>
                                </li>
                                <li className="px-3 py-2 hover:bg-gray-50 rounded-md flex items-center justify-between cursor-pointer text-sm text-gray-600">
                                    <span className="flex items-center gap-3"><i className="fas fa-star text-gray-400"></i> Favoritos</span>
                                    <span className="bg-gray-100 text-gray-500 text-[10px] font-bold px-2 py-0.5 rounded-full">1</span>
                                </li>
                            </ul>

                            <div className="flex items-center justify-between border-b pb-3 mb-3">
                                <span className="text-xs font-bold uppercase tracking-wider text-gray-500">Categorias</span>
                                <button className="border border-gray-300 hover:bg-gray-50 text-gray-600 p-1 rounded text-[10px] transition-colors"><i className="fas fa-plus"></i></button>
                            </div>
                            <ul className="space-y-1">
                                {categories.map((cat, idx) => (
                                    <li key={idx} className="px-3 py-2 hover:bg-gray-50 rounded-md flex items-center justify-between cursor-pointer text-sm text-gray-600 border border-transparent hover:border-gray-200 transition-all">
                                        <span className="flex items-center gap-3"><i className={`fas ${cat.icon} text-gray-400`}></i> {cat.name}</span>
                                        <span className="bg-gray-100 text-gray-500 text-[10px] font-bold px-2 py-0.5 rounded-full">{cat.count}</span>
                                    </li>
                                ))}
                            </ul>
                        </aside>

                        {/* ÁREA DOS CARDS */}
                        <main className="flex-1 bg-white rounded-xl p-6 border border-gray-200 shadow-sm">
                            <div className="flex items-center justify-between mb-6">
                                <h2 className="text-base font-bold text-gray-800">Últimos Documentos</h2>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                                {/* Simulação de filtro básico pelo título (para testar a busca) */}
                                {mockDocs.filter(doc => 
                                    doc.title.toLowerCase().includes(searchTerm.toLowerCase())
                                ).map((doc) => (
                                    <div key={doc.id} className="bg-white rounded-xl border border-gray-200 p-5 hover:border-[#FF9900] hover:shadow-md transition-all duration-200 cursor-pointer flex flex-col h-full relative">
                                        
                                        <div className="flex items-start justify-between mb-3">
                                            <div className="flex gap-2 flex-wrap">
                                                {doc.tags.map((tag, i) => (
                                                    <span key={i} className="bg-gray-100 text-gray-600 border border-gray-200 text-[10px] font-medium px-2 py-0.5 rounded-md">{tag}</span>
                                                ))}
                                            </div>
                                            <div className="flex items-center gap-1 text-gray-400 text-[10px] font-medium">
                                                {doc.date}
                                            </div>
                                        </div>

                                        <h3 className="text-sm font-bold text-gray-800 mb-1 leading-tight">{doc.title}</h3>
                                        <p className="text-xs text-gray-500 leading-relaxed mb-4 flex-1 line-clamp-2">{doc.desc}</p>

                                        {/* Bloco de cor */}
                                        {doc.mainCard && (
                                            <div className={`${doc.mainCard.color} border rounded-lg p-3 text-center mb-4 shadow-sm w-full`} style={{ aspectRatio: '16/9' }}>
                                                <p className="font-bold text-xs tracking-wide">{doc.mainCard.title}</p>
                                            </div>
                                        )}

                                        {/* Rodapé */}
                                        <div className="mt-auto pt-3 border-t border-gray-100 flex items-center justify-between">
                                            <div className="flex gap-2">
                                                {doc.labels.map((label, i) => (
                                                    <span key={i} className="bg-gray-50 text-gray-500 border border-gray-200 text-[9px] px-2 py-0.5 rounded-full">{label}</span>
                                                ))}
                                            </div>
                                            <div className="flex items-center gap-2 text-gray-400">
                                                <i className="fas fa-pen hover:text-[#FF9900] cursor-pointer"></i>
                                                <i className="fas fa-trash-alt hover:text-red-500 cursor-pointer"></i>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                                
                                {/* Caso a busca não encontre nada */}
                                {mockDocs.filter(doc => doc.title.toLowerCase().includes(searchTerm.toLowerCase())).length === 0 && (
                                    <div className="col-span-full text-center py-10 text-gray-400">
                                        <i className="fas fa-search text-4xl mb-2 opacity-50"></i>
                                        <p>Nenhum documento encontrado para "{searchTerm}"</p>
                                    </div>
                                )}
                            </div>
                        </main>
                    </div>
                </div>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
