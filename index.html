<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Painel de Notas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f7f7f7; }
        .modal-enter { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        input[type="file"] { display: none; }
        
        @keyframes progressAnimation {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .animate-progress {
            animation: progressAnimation 1.5s ease-in-out forwards;
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col bg-[#f7f7f7] text-gray-700">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SUPABASE_URL = 'https://txvjclviogmaxndzuxle.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_N1677l9hUFxq_f4C9Y4BPQ_aZEdkd2_';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const STORAGE_BUCKET = 'arquivos';

        const COLORS = {
            yellow: { label: 'Amarelo', border: 'border-yellow-200', text: 'text-yellow-700', bg: 'bg-yellow-50' },
            blue: { label: 'Azul Sereno', border: 'border-blue-200', text: 'text-blue-700', bg: 'bg-blue-50' },
            green: { label: 'Verde', border: 'border-emerald-200', text: 'text-emerald-700', bg: 'bg-emerald-50' },
            pink: { label: 'Rosa', border: 'border-pink-200', text: 'text-pink-700', bg: 'bg-pink-50' },
            purple: { label: 'Lavanda', border: 'border-purple-200', text: 'text-purple-700', bg: 'bg-purple-50' },
            slate: { label: 'Cinza', border: 'border-gray-300', text: 'text-gray-700', bg: 'bg-gray-100' }
        };

        const App = () => {
            const [searchTerm, setSearchTerm] = useState("");
            const [docs, setDocs] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [newTitle, setNewTitle] = useState("");
            const [newDesc, setNewDesc] = useState("");
            const [newColor, setNewColor] = useState("yellow");
            const [isSaving, setIsSaving] = useState(false);
            const [attachedFile, setAttachedFile] = useState(null);
            const [attachedFileName, setAttachedFileName] = useState("");
            const [uploadProgress, setUploadProgress] = useState(0);
            const [isUploading, setIsUploading] = useState(false);
            
            const fileInputRef = useRef(null);
            const descTextareaRef = useRef(null); 
            const imageInputRef = useRef(null);

            // --- ESTADO DA VISUALIZAÇÃO DA IMAGEM (LIGHTBOX) ---
            const [lightboxImage, setLightboxImage] = useState(null);

            const loadDocuments = async () => {
                setLoading(true);
                const { data, error } = await supabase.from('documents').select('*').order('id', { ascending: false });
                if (error) {
                    setDocs([]);
                } else {
                    const formattedData = data.map(item => ({
                        id: item.id,
                        tags: item.tags ? item.tags.split(',').map(t => t.trim()) : ['Geral'],
                        title: item.title || 'Sem título',
                        desc: item.description || 'Sem descrição.',
                        date: new Date(item.created_at).toLocaleDateString('pt-BR'),
                        labels: ['#importante'],
                        colorKey: item.color_key || 'yellow',
                        fileAttachment: item.file_name || null,
                        file_url: item.file_url || null
                    }));
                    setDocs(formattedData);
                }
                setLoading(false);
            };

            useEffect(() => { loadDocuments(); }, []);

            const uploadFileToSupabase = async (file) => {
                setIsUploading(true);
                setUploadProgress(0);

                const progressInterval = setInterval(() => {
                    setUploadProgress(prev => {
                        if (prev >= 95) {
                            clearInterval(progressInterval);
                            return 95;
                        }
                        return prev + 10;
                    });
                }, 150);

                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}_${Math.random().toString(36).substr(2, 9)}.${fileExt}`;
                
                const { data, error } = await supabase.storage.from(STORAGE_BUCKET).upload(fileName, file);

                clearInterval(progressInterval);
                
                if (error) {
                    setUploadProgress(0);
                    setIsUploading(false);
                    console.error("🚨 ERRO NO STORAGE:", error);
                    return null;
                }

                setUploadProgress(100);
                setIsUploading(false);

                const { data: urlData } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(fileName);
                return urlData.publicUrl;
            };

            const handleDeleteDocument = async (id, title) => {
                if (!confirm(`Tem certeza que deseja excluir "${title}"?`)) return;
                const { error } = await supabase.from('documents').delete().eq('id', id);
                if (!error) setDocs(prevDocs => prevDocs.filter(doc => doc.id !== id));
            };

            const insertTextAtCursor = (text) => {
                const textarea = descTextareaRef.current;
                if (!textarea) return;
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                textarea.setRangeText(text, start, end, 'end');
                setNewDesc(textarea.value);
                setTimeout(() => {
                    textarea.selectionStart = textarea.selectionEnd = start + text.length;
                    textarea.focus();
                }, 0);
            };

            const handlePaste = async (e) => {
                const items = e.clipboardData.items;
                let pastedImage = null;
                for (let item of items) {
                    if (item.type.indexOf('image') !== -1) {
                        pastedImage = item.getAsFile();
                        break;
                    }
                }
                if (pastedImage) {
                    e.preventDefault();
                    const imageUrl = await uploadFileToSupabase(pastedImage);
                    if (imageUrl) {
                        const markdownImage = `\n![${pastedImage.name}](${imageUrl})\n`;
                        insertTextAtCursor(markdownImage);
                    }
                }
            };

            const handleImageSelect = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    const imageUrl = await uploadFileToSupabase(file);
                    if (imageUrl) {
                        const markdownImage = `\n![${file.name}](${imageUrl})\n`;
                        insertTextAtCursor(markdownImage);
                    }
                }
                e.target.value = null;
            };

            const renderDescription = (text) => {
                if (!text) return "";
                let safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                safeText = safeText.replace(/\n/g, "<br />");
                const imgRegex = /!\[(.*?)\]\((.*?)\)/g;
                safeText = safeText.replace(imgRegex, (match, altText, url) => {
                    return `<div class="my-2"><img src="${url}" alt="${altText}" class="w-full h-auto rounded-lg border border-gray-100 shadow-sm max-h-[140px] object-contain bg-gray-50 cursor-pointer hover:opacity-90 transition-opacity" onclick="window.handleImageClick('${url}')" /></div>`;
                });
                return safeText;
            };

            const openCreateModal = () => {
                setEditingId(null); setNewTitle(""); setNewDesc(""); setNewColor("yellow");
                setAttachedFile(null); setAttachedFileName(""); setUploadProgress(0); setIsUploading(false);
                setIsModalOpen(true);
            };

            const openCardAsModal = (doc) => {
                setEditingId(doc.id); 
                setNewTitle(doc.title); 
                setNewDesc(doc.desc);
                setNewColor(doc.colorKey); 
                setAttachedFileName(doc.fileAttachment || "");
                setAttachedFile(null); 
                setIsModalOpen(true);
            };

            const closeModal = () => { 
                setIsModalOpen(false); setIsSaving(false); setIsUploading(false); setUploadProgress(0);
            };
            
            const triggerFileUpload = () => fileInputRef.current.click();
            const triggerImageUpload = () => imageInputRef.current.click();

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) { 
                    setAttachedFile(file); 
                    setAttachedFileName(file.name); 
                }
            };

            const handleSaveDocument = async () => {
                if (!newTitle.trim()) { alert("Por favor, digite um título."); return; }
                setIsSaving(true);
                let fileUrl = null;
                
                if (attachedFile) {
                    fileUrl = await uploadFileToSupabase(attachedFile);
                    if (!fileUrl) {
                        setIsSaving(false);
                        alert("Falha ao fazer upload do arquivo.");
                        return;
                    }
                }

                const docData = { 
                    title: newTitle.trim(), 
                    description: newDesc.trim() || "Sem descrição.",
                    color_key: newColor,
                    file_name: attachedFileName || null,
                    file_url: fileUrl
                };

                let error;
                if (editingId) {
                    const { error: updateError } = await supabase.from('documents').update(docData).eq('id', editingId);
                    error = updateError;
                } else {
                    const { error: insertError } = await supabase.from('documents').insert(docData);
                    error = insertError;
                }

                setIsSaving(false);
                if (!error) {
                    closeModal(); loadDocuments();
                } else {
                    console.error("🚨 ERRO NO BANCO (DB):", error);
                    alert("Erro ao salvar no banco.");
                }
            };

            return (
                <div className="flex flex-col h-screen bg-[#f7f7f7] overflow-hidden relative">
                    <header className="bg-white px-4 sm:px-6 py-4 flex flex-wrap items-center justify-between shrink-0 shadow-sm border-b border-gray-100">
                        <div className="flex items-center gap-3">
                            <div className="text-[#FF9900] text-2xl"><i className="fas fa-sticky-note"></i></div>
                            <div>
                                <h1 className="text-lg sm:text-xl font-bold text-gray-800 tracking-tight">Notas</h1>
                            </div>
                        </div>
                        <div className="flex items-center gap-2 ml-auto sm:ml-0">
                            <button onClick={openCreateModal} className="bg-[#FF9900] hover:bg-[#e88d00] text-white px-3 py-2 rounded-lg text-xs sm:text-sm font-bold flex items-center gap-2 transition-colors shadow-sm whitespace-nowrap">
                                <i className="fas fa-plus"></i> <span className="hidden sm:inline">Nova Nota</span>
                            </button>
                        </div>
                    </header>

                    <div className="flex-1 overflow-y-auto p-4 sm:p-6">
                        <div className="max-w-4xl mx-auto mb-6 sm:mb-8 w-full">
                            <div className="bg-white rounded-xl shadow-sm border border-gray-200 relative group transition-shadow hover:shadow-md">
                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><i className="fas fa-search text-gray-400 group-focus-within:text-[#FF9900] transition-colors"></i></div>
                                <input type="text" placeholder="Pesquisar notas..." className="w-full bg-transparent text-gray-800 pl-11 pr-4 py-3 rounded-xl outline-none placeholder-gray-400" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                            </div>
                        </div>
                        
                        <div className="flex flex-col lg:flex-row gap-6 h-full">
                            <main className="flex-1 w-full">
                                <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
                                    {loading && <div className="col-span-full flex justify-center py-10"><div className="animate-spin rounded-full h-8 w-8 border-b-2 border-[#FF9900]"></div></div>}
                                    {!loading && docs.filter(doc => doc.title.toLowerCase().includes(searchTerm.toLowerCase())).map((doc) => {
                                        const style = COLORS[doc.colorKey] || COLORS['yellow'];
                                        return (
                                            <div 
                                                key={doc.id} 
                                                onClick={() => openCardAsModal(doc)}
                                                className="bg-white rounded-2xl border border-gray-200 p-5 hover:shadow-lg hover:border-[#FF9900] transition-all duration-200 cursor-pointer flex flex-col h-full relative group"
                                            >
                                                
                                                <div className="absolute top-3 right-3 flex items-center gap-2 text-gray-400 opacity-0 group-hover:opacity-100 transition-opacity duration-200">
                                                    <i className="fas fa-pen hover:text-[#FF9900] cursor-pointer transition-colors text-sm" onClick={(e) => { e.stopPropagation(); openCardAsModal(doc); }}></i>
                                                    <i className="fas fa-trash-alt hover:text-red-500 cursor-pointer transition-colors text-sm" onClick={(e) => { e.stopPropagation(); handleDeleteDocument(doc.id, doc.title); }}></i>
                                                </div>
                                                
                                                <div className="flex items-start justify-between mb-2">
                                                    <h3 className="text-base font-bold text-gray-800 leading-tight flex-1 pr-8 truncate">{doc.title}</h3>
                                                </div>
                                                
                                                <div 
                                                    className="text-sm text-gray-600 leading-relaxed mb-3 flex-1 overflow-hidden"
                                                    style={{ maxHeight: 'calc(140px + 2rem)' }}
                                                >
                                                    <div 
                                                        className="[&_img]:max-w-full [&_img]:h-auto [&_img]:rounded-xl [&_img]:border [&_img]:border-gray-100 [&_img]:my-3 [&_img]:shadow-sm line-clamp-4"
                                                        dangerouslySetInnerHTML={{ __html: renderDescription(doc.desc) }}
                                                    ></div>
                                                </div>
                                                
                                                <div className="flex flex-wrap gap-2 mb-3 mt-auto">
                                                    {doc.tags.map((tag, i) => (<span key={i} className={`text-[10px] font-medium px-2.5 py-0.5 rounded-full ${style.bg} ${style.text} border ${style.border}`}>{tag}</span>))}
                                                </div>

                                                {doc.fileAttachment && (
                                                    <div className="mb-0 bg-gray-50 border border-gray-200 rounded-lg p-3 flex items-center gap-3 cursor-pointer hover:bg-gray-100 transition-colors" onClick={(e) => { e.stopPropagation(); if(doc.file_url) window.open(doc.file_url, '_blank'); else alert("Arquivo sem URL salva."); }}>
                                                        <div className="bg-white p-1.5 rounded border border-gray-200"><i className="fas fa-paperclip text-blue-500 text-xs"></i></div>
                                                        <span className="text-xs text-gray-600 truncate flex-1">{doc.fileAttachment}</span>
                                                        <span className="text-[10px] font-medium text-blue-600">Abrir</span>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </main>
                        </div>
                    </div>

                    {/* MODAL DE EDIÇÃO/CRIAÇÃO */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden modal-enter max-h-[90vh] flex flex-col">
                                <div className="flex justify-between items-center p-4 sm:p-6 border-b border-gray-100 shrink-0">
                                    <h3 className="text-base sm:text-lg font-bold text-gray-800">{editingId ? 'Editar Nota' : 'Nova Nota'}</h3>
                                    <button onClick={closeModal} className="text-gray-400 hover:text-gray-600 transition-colors"><i className="fas fa-times text-xl"></i></button>
                                </div>
                                <div className="p-4 sm:p-6 space-y-4 overflow-y-auto">
                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Título</label><input type="text" className="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#FF9900] focus:border-transparent transition-all" value={newTitle} onChange={(e) => setNewTitle(e.target.value)} autoFocus /></div>
                                    
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1 flex justify-between items-center">
                                            <span>Descrição</span>
                                            <button onClick={triggerImageUpload} className="flex items-center gap-1 text-xs text-[#FF9900] hover:underline font-medium">
                                                <i className="fas fa-image"></i> Inserir Imagem
                                            </button>
                                        </label>
                                        <input type="file" ref={imageInputRef} onChange={handleImageSelect} accept="image/*" />
                                        <textarea 
                                            ref={descTextareaRef}
                                            className="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#FF9900] focus:border-transparent transition-all resize-none h-32"
                                            value={newDesc} onChange={(e) => setNewDesc(e.target.value)} onPaste={handlePaste}
                                            placeholder="Digite sua nota. Use o botão 'Inserir Imagem' para adicionar fotos."
                                        ></textarea>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">Anexar Arquivo (PDF, Outros...)</label>
                                        <input type="file" ref={fileInputRef} onChange={handleFileChange} accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" />
                                        <div onClick={triggerFileUpload} className="border-2 border-dashed rounded-xl p-4 text-center cursor-pointer transition-all duration-300 flex flex-col items-center gap-1 bg-gray-50 hover:bg-gray-100 border-gray-300 hover:border-[#FF9900]">
                                            <i className="fas fa-cloud-upload-alt text-gray-400 text-xl"></i>
                                            <span className="text-xs text-gray-500 font-medium">{attachedFileName ? `Anexado: ${attachedFileName}` : 'Toque para selecionar um arquivo'}</span>
                                            {isUploading && (
                                                <div className="w-full mt-3">
                                                    <div className="w-full bg-gray-200 rounded-full h-2"><div className="bg-[#FF9900] h-2 rounded-full animate-progress" style={{ width: '0%' }}></div></div>
                                                    <p className="text-[10px] text-gray-400 mt-1">Enviando...</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">Cor da Nota</label>
                                        <div className="flex flex-wrap gap-2">
                                            {Object.entries(COLORS).map(([key, color]) => (
                                                <button 
                                                    key={key} 
                                                    onClick={() => setNewColor(key)} 
                                                    className={`flex items-center gap-2 px-3 py-2 rounded-lg border-2 transition-all ${newColor === key ? 'border-[#FF9900] bg-orange-50' : 'border-transparent hover:bg-gray-50'}`}
                                                >
                                                    <div className={`w-4 h-4 rounded-full ${color.bg} border ${color.border}`}></div>
                                                    <span className="text-xs font-medium text-gray-600">{color.label}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                                <div className="flex justify-end gap-3 p-4 sm:p-6 border-t border-gray-100 bg-gray-50 rounded-b-2xl shrink-0">
                                    <button onClick={closeModal} className="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Cancelar</button>
                                    <button onClick={handleSaveDocument} disabled={isSaving} className={`px-4 py-2 text-sm font-bold text-white rounded-lg transition-colors flex items-center gap-2 ${isSaving ? 'bg-[#d97700] cursor-not-allowed' : 'bg-[#FF9900] hover:bg-[#e88d00]'}`}>
                                        {isSaving ? (<><div className="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></div> {isUploading ? 'Enviando...' : 'Salvando...'}</>) : (editingId ? 'Salvar Alterações' : 'Salvar Nota')}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- LIGHTBOX (VISUALIZAÇÃO AMPLIADA DA IMAGEM) --- */}
                    {lightboxImage && (
                        <div 
                            className="fixed inset-0 z-[60] bg-black bg-opacity-90 flex items-center justify-center p-4 cursor-zoom-out"
                            onClick={() => setLightboxImage(null)}
                        >
                            <button 
                                onClick={() => setLightboxImage(null)}
                                className="absolute top-4 right-4 text-white hover:text-gray-300 text-3xl z-10"
                            >
                                <i className="fas fa-times-circle"></i>
                            </button>
                            <img 
                                src={lightboxImage} 
                                alt="Visualização ampliada" 
                                className="max-w-full max-h-full object-contain rounded-lg shadow-2xl"
                            />
                        </div>
                    )}
                </div>
            );
        };

        // EXPOR A FUNÇÃO DE CLIQUE NO ESCOPO GLOBAL PARA O REACT
        window.handleImageClick = (url) => {
            // Encontra a instância do App e atualiza o estado
            const appInstance = document.querySelector('#root').__reactRoot$?.current?.memoizedState?.element?.type?.prototype?.setLightboxImage;
            if (appInstance) {
                appInstance(url);
            } else {
                // Fallback para abrir em nova aba se o React não pegar
                window.open(url, '_blank');
            }
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
